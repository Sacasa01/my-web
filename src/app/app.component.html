<!-- FULL-WIDTH PAGE with BOXED CONTENT STRIP -->
<div class="min-h-screen w-full theme-transition font-body" [style.background-color]="bgColor()">

  <!-- ═══ TOP CONTROLS BAR ═══ -->
  <header class="fixed top-0 left-0 right-0 z-50 flex items-center justify-end gap-3 px-6 py-4">

    <!-- Language Toggle -->
    <button 
      (click)="toggleLang()"
      class="control-pill px-4 py-2 rounded-full text-[13px] font-semibold tracking-wide cursor-pointer border select-none"
      [ngClass]="theme() === 'light' 
        ? 'bg-white/60 border-black/8 text-neutral-800 hover:bg-white/90' 
        : 'bg-white/8 border-white/12 text-white/80 hover:bg-white/16'">
      {{ lang() === 'en' ? '🇪🇸 ES' : '🇬🇧 EN' }}
    </button>

    <!-- Theme Toggle -->
    <button 
      (click)="toggleTheme()"
      class="control-pill w-10 h-10 rounded-full text-lg cursor-pointer border flex items-center justify-center select-none"
      [ngClass]="theme() === 'light' 
        ? 'bg-white/60 border-black/8 text-neutral-800 hover:bg-white/90' 
        : 'bg-white/8 border-white/12 text-white/80 hover:bg-white/16'">
      {{ theme() === 'light' ? '🌙' : '☀️' }}
    </button>

  </header>

  <!-- ═══ HERO SECTION ═══ -->
  <section class="min-h-screen w-full flex items-center justify-center px-4">

    <!-- BOXED CONTENT (max-width centered strip) -->
    <div class="w-full max-w-6xl mx-auto flex flex-col lg:flex-row items-center gap-8 lg:gap-4">

      <!-- LEFT: Character Image (slightly left-aligned) -->
      <div class="flex-shrink-0 flex items-end justify-center lg:justify-start lg:w-[45%]">
        <img 
          src="/assets/santiago-character.png" 
          alt="Santiago Castro Salt — Pixar Style Character"
          class="character-img w-[280px] sm:w-[340px] md:w-[400px] lg:w-[420px] xl:w-[460px] h-auto object-contain select-none pointer-events-none" />
      </div>

      <!-- RIGHT: Text Content -->
      <div class="flex flex-col items-center lg:items-start text-center lg:text-left lg:w-[55%] space-y-5">
        
        <!-- Greeting -->
        <p class="font-anton text-[clamp(1.2rem,2.5vw,1.8rem)] tracking-wide"
           [style.color]="mutedColor()">
          {{ t().greeting }}
        </p>

        <!-- Name — BIG Anton -->
        <h1 class="font-anton leading-[0.9] select-none"
            [style.color]="textColor()">
          <span class="block text-[clamp(4rem,10vw,9rem)]">{{ t().name }}</span>
          <span class="block text-[clamp(2.5rem,6vw,5.5rem)]" [style.color]="mutedColor()">
            {{ t().surname }}
          </span>
        </h1>

        <!-- Role -->
        <p class="font-body text-[clamp(0.85rem,1.4vw,1.1rem)] font-medium max-w-md leading-relaxed"
           [style.color]="mutedColor()">
          {{ t().role }}
        </p>

        <!-- Location -->
        <p class="font-body text-[clamp(0.75rem,1.1vw,0.9rem)] font-medium tracking-wide"
           [style.color]="mutedColor()">
          📍 {{ t().location }}
        </p>

        <!-- CTA Button -->
        <a href="#work" 
           class="mt-2 inline-flex items-center gap-2 px-8 py-3.5 rounded-full font-semibold text-[14px] tracking-wide transition-all duration-300 cursor-pointer select-none"
           [ngClass]="theme() === 'light' 
             ? 'bg-neutral-900 text-white hover:bg-neutral-700 shadow-lg shadow-black/10' 
             : 'bg-white text-neutral-900 hover:bg-neutral-200 shadow-lg shadow-white/10'">
          {{ t().cta }}
          <span class="text-lg">↓</span>
        </a>

      </div>

    </div>
  </section>

</div>
