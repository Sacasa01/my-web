<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="scSinopia" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5722"/>
      <stop offset="50%" stop-color="#D7340B"/>
      <stop offset="100%" stop-color="#A52000"/>
    </linearGradient>
    <linearGradient id="scCaribbean" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1A3537"/>
      <stop offset="40%" stop-color="#336467"/>
      <stop offset="100%" stop-color="#55999D"/>
    </linearGradient>
    <linearGradient id="scVanilla" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDE8"/>
      <stop offset="100%" stop-color="#E0DDAE"/>
    </linearGradient>
    <filter id="subtleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect x="6" y="6" width="116" height="116" rx="30" fill="#0D1718" stroke="#336467" stroke-opacity="0.4" stroke-width="2.5"/>
  <circle cx="64" cy="64" r="54" fill="none" stroke="url(#scSinopia)" stroke-opacity="0.15" stroke-width="1.5"/>
  <g filter="url(#subtleShadow)">
    <!-- C Shape: Prominent Outer Curve embracing the monogram -->
    <path d="M 94 36 C 80 22, 48 20, 32 38 C 16 56, 16 72, 32 90 C 48 108, 80 106, 94 92" fill="none" stroke="url(#scCaribbean)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- S Shape: Intersecting and Flowing S Curve -->
    <path d="M 88 38 C 76 26, 44 28, 44 48 C 44 62, 84 66, 84 80 C 84 100, 52 102, 40 90" fill="none" stroke="url(#scSinopia)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Vanilla Accent Dots on Terminals -->
    <circle cx="94" cy="36" r="3.5" fill="url(#scVanilla)"/>
    <circle cx="40" cy="90" r="3.5" fill="url(#scVanilla)"/>
  </g>
</svg>
